<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>توزيع المهام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ee;--card:#ffffff;--ink:#1d2026;--muted:#6b7079;--line:#e7e3da;
  --accent:#5b4cf0;--accent-ink:#fff;--accent-soft:#eeecff;
  --ok:#15a05a;--ok-soft:#e5f6ec;--warn:#c97a06;--warn-soft:#fff3dd;--danger:#d63a3a;--danger-soft:#fdeaea;
  --radius:18px;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#131418;--card:#1d1f25;--ink:#eceef2;--muted:#9aa0aa;--line:#2c2f37;
  --accent:#8f86ff;--accent-ink:#111;--accent-soft:#25264a;
  --ok:#4ade80;--ok-soft:#173223;--warn:#fbbf24;--warn-soft:#3a2f16;--danger:#f87171;--danger-soft:#3a1d1d;
  --shadow:none;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Cairo,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 90px}
header.top{padding:18px 2px 12px}
.brand{display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand h1{font-size:24px;font-weight:800;margin:0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.gbar{height:14px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:14px}
.gbar-fill{height:100%;border-radius:99px;background:linear-gradient(270deg,var(--accent),#c04cf0);transition:width .5s ease}
.gstats{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px;gap:8px}
.gstats b{color:var(--ink)}
nav.tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--bg);padding:8px 0 10px}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 4px;border-radius:14px;text-decoration:none;color:var(--muted);font-size:13px;font-weight:700}
.tab .ti{font-size:20px;line-height:1.2}
.tab.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);outline:1px solid var(--line)}
.badge{position:absolute;top:3px;inset-inline-start:calc(50% + 10px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:11px;display:flex;align-items:center;justify-content:center}
.badge.dot{min-width:10px;width:10px;height:10px;padding:0;top:6px;inset-inline-start:calc(50% + 8px);background:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card.hero{border:2px solid var(--accent);padding:18px}
.card h2{margin:0 0 4px;font-size:20px}
.card h3{margin:0 0 2px;font-size:17px}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 2px 10px}
.sec h2{font-size:17px;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.desc{white-space:pre-wrap;margin:6px 0 0;color:var(--ink);opacity:.9}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:8px}
.av{width:24px;height:24px;border-radius:50%;object-fit:cover;flex:none;background:var(--line)}
.av.lg{width:36px;height:36px;font-size:16px}
.av.ini{display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px;line-height:1}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;min-height:44px;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}
.btn.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{min-height:36px;padding:4px 10px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar>div{height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.pbar.done>div{background:var(--ok)}
.pbig{display:flex;align-items:baseline;justify-content:space-between;margin:16px 0 8px}
.pbig .pct{font-size:34px;font-weight:800;direction:ltr}
input[type=range]{width:100%;accent-color:var(--accent);height:32px;margin:6px 0 2px}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.quick .btn{min-height:38px;padding:4px;font-size:14px;direction:ltr}
.quick .btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
label.lbl{display:block;font-weight:800;margin:18px 0 6px}
textarea,input[type=text],input[type=password]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;resize:vertical;outline:none}
textarea:focus,input[type=text]:focus,input[type=password]:focus{border-color:var(--accent)}
textarea{min-height:120px}
.savestate{font-size:12px;color:var(--muted);margin-top:4px;min-height:18px}
.savestate.dirty{color:var(--warn)}
details{margin-top:10px}
summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--accent);list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"◂ ";}
details[open] summary::before{content:"▾ ";}
.notes{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:15px}
.empty{text-align:center;padding:30px 16px}
.empty .big{font-size:44px}
.banner{border-radius:14px;padding:10px 14px;margin:0 0 12px;font-size:14px;background:var(--warn-soft);color:var(--warn)}
.lead{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center}
.medal{font-size:20px;width:26px;text-align:center}
.icon-btn{appearance:none;border:none;background:transparent;padding:6px;border-radius:8px;cursor:pointer;font-size:16px;color:var(--muted)}
.icon-btn:hover{background:var(--bg)}
.resume{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:var(--warn);background:var(--warn-soft);padding:2px 10px;border-radius:99px}
.mask{position:fixed;inset:0;background:rgba(10,10,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .15s}
@media (min-width:640px){.mask{align-items:center}}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 18px 24px;max-height:92vh;overflow:auto;animation:up .2s ease}
@media (min-width:640px){.sheet{border-radius:22px}}
.sheet h2{margin:0 0 4px}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.dice{font-size:22px;font-weight:800;text-align:center;padding:26px 10px;border-radius:16px;background:var(--accent-soft);color:var(--accent);margin:14px 0;min-height:96px;display:flex;align-items:center;justify-content:center}
.dice.land{background:var(--ok-soft);color:var(--ok);animation:pop .35s}
@keyframes pop{50%{transform:scale(1.05)}}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;max-width:92vw;transition:transform .25s;z-index:60;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;top:-30px;font-size:26px;z-index:70;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.7}}
.skeleton{height:90px;border-radius:var(--radius);background:linear-gradient(90deg,var(--card),var(--line),var(--card));background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:12px}
@keyframes sh{to{background-position:-200% 0}}
.subs{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.card.info{background:var(--accent-soft);border-color:transparent;margin:4px 0 6px}
.info h3{margin:0}
.info-text{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:6px;font-size:15px}
.info-text.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.info a{color:var(--accent);font-weight:700}
.info textarea{background:var(--card);min-height:140px}
.more{appearance:none;border:none;background:none;color:var(--accent);font:inherit;font-weight:700;font-size:14px;padding:4px 0;cursor:pointer}
.info-empty{display:block;width:100%;margin:4px 0 6px;text-align:center;border:2px dashed var(--line);box-shadow:none;color:var(--muted);font:inherit;font-weight:700;cursor:pointer}
.polls-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 2px 6px}
.polls-head h2{font-size:16px;margin:0}
.poll{padding:14px}
.poll h3{margin:0;font-size:16px;overflow-wrap:anywhere}
.opt{position:relative;display:flex;align-items:center;gap:8px;width:100%;min-height:44px;margin-top:6px;padding:6px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden;cursor:pointer;text-align:start;font:inherit;color:inherit}
.opt[disabled]{cursor:default}
.opt .fillb{position:absolute;inset-block:0;inset-inline-start:0;background:var(--accent-soft);transition:width .4s;z-index:0}
.opt.mine{border-color:var(--accent);border-width:2px}
.opt.mine .fillb{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.opt.win .lab{font-weight:800}
.opt>*:not(.fillb){position:relative;z-index:1}
.opt .lab{flex:1;min-width:0;overflow-wrap:anywhere}
.opt .cnt{font-weight:800;font-size:15px;display:inline-flex;align-items:baseline;gap:6px;flex:none}
.opt .cnt small{font-size:12px;font-weight:600;color:var(--muted)}
.voters{display:flex;flex:none}
.voters .av{width:20px;height:20px;font-size:10px;box-shadow:0 0 0 2px var(--card)}
.voters .av+.av{margin-inline-start:-5px}
.optrow{display:flex;align-items:center;gap:2px}
.btn.x{min-height:32px;padding:2px 8px;border-color:transparent;color:var(--muted);font-weight:600}
.btn.x.armed{color:#fff}
.sub-add input[type=text]{min-width:0}
.optrow .opt{flex:1}
.poll-form .optin{margin-top:8px}
.subw{border-radius:12px;background:var(--bg)}
.subw.open{outline:1px solid var(--line)}
.sub{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:15px}
.sub .t{flex:1;min-width:0;overflow-wrap:anywhere;appearance:none;border:none;background:none;padding:4px 0;text-align:start;cursor:pointer;font:inherit;color:inherit;display:flex;align-items:center;gap:6px}
.sub .t .ic{font-size:13px;opacity:.55;flex:none}
.sub .t .ic.has{opacity:1}
.subp{padding:0 10px 10px}
.subp textarea{min-height:80px;background:var(--card)}
.subp .lbl2{display:block;font-size:13px;font-weight:800;margin:6px 0 4px;color:var(--muted)}
.subp .notes{background:var(--card);margin-top:0}
.sub.done .t{text-decoration:line-through;color:var(--muted)}
.sub .who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex:none}
.chk{appearance:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:var(--card);cursor:pointer;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#fff;padding:0}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk[disabled]{cursor:default;opacity:.7}
.mini{width:54px;height:6px}
.sub-add{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.sub-add input[type=text]{flex:1 1 180px;width:auto;padding:9px 12px}
.crumb{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-bottom:2px}
.hint{font-size:13px;color:var(--muted);margin:2px 0 0}
.auto{font-size:12px;color:var(--muted);font-weight:600}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<script>
(() => {
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k === "style") el.setAttribute("style", v);
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (k === "value" || k === "checked" || k === "disabled" || k === "open") el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
}
function ago(ms) {
  if (!ms) return "";
  const s = (Date.now() - ms) / 1000;
  if (s < 60) return "الآن";
  if (s < 3600) return `منذ ${Math.floor(s / 60)} دقيقة`;
  if (s < 86400) return `منذ ${Math.floor(s / 3600)} ساعة`;
  const d = Math.floor(s / 86400);
  if (d < 7) return `منذ ${d} يوم`;
  return "في " + new Date(ms).toLocaleDateString("ar-u-nu-latn", { day: "numeric", month: "long" });
}
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}
function confetti() {
  const em = ["🎉", "✨", "⭐", "🥳", "💪", "✅"];
  for (let i = 0; i < 22; i++) {
    const s = h("span", { class: "confetti", text: em[i % em.length],
      style: `left:${Math.random() * 100}vw;animation-delay:${Math.random() * .5}s;font-size:${18 + Math.random() * 18}px` });
    document.body.append(s); setTimeout(() => s.remove(), 2600);
  }
}

/* ---------- state ---------- */
const S = {
  me: null, myId: null, isAdmin: false, canWrite: true, joinCode: "",
  tasks: [], users: {}, userList: [], stepsBy: {}, polls: [], pollDraft: {}, showClosedPolls: false, loaded: false, stale: false, error: null, authed: null,
  drafts: {}, saving: {}, subDraft: {}, openSplit: {}, openSub: {}, armed: null, dragging: false, renderQueued: false,
};
const ERR = {
  not_logged_in: "انتهت الجلسة، سجّل الدخول من جديد.", bad_credentials: "اسم المستخدم أو كلمة المرور غير صحيحة.",
  bad_join_code: "رمز الانضمام غير صحيح.", registration_closed: "التسجيل مغلق حالياً. اطلب من المسؤول إنشاء حساب لك.",
  bad_username: "اسم المستخدم: 3 أحرف على الأقل (حروف لاتينية صغيرة، أرقام، . _ -).", bad_name: "اكتب اسمك.",
  short_password: "كلمة المرور: 6 أحرف على الأقل.", username_taken: "اسم المستخدم هذا مستخدم من قبل.",
  already_taken: "تأخرت، لقد أُخذت للتو!", has_current_task: "أنهِ مهمتك الحالية أولاً 😉",
  not_allowed: "لا يمكن تنفيذ هذا الإجراء (ربما تغيّرت المهمة).", admin_only: "هذا الإجراء للمسؤول فقط.",
  title_required: "أعطِ المهمة عنواناً", cannot_delete_self: "لا يمكنك حذف حسابك.", cannot_change_self: "لا يمكنك تغيير صلاحياتك.",
  question_required: "اكتب سؤال التصويت.", option_required: "اكتب الخيار.", option_exists: "هذا الخيار موجود من قبل.",
  poll_closed: "هذا التصويت مغلق.", too_many_options: "عدد الخيارات كبير جداً (20 كحد أقصى).",
  subtasks_pending: "لم تكتمل كل المهام الفرعية بعد.", no_nested: "المهمة الفرعية لا يمكن تقسيمها إلى مهام للفريق، أضف خطوات بدلاً من ذلك.",
};
async function api(method, url, body) {
  const opt = { method, credentials: "same-origin", headers: {} };
  if (method !== "GET") { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body || {}); }
  let r;
  try { r = await fetch(url, opt); } catch (e) { const er = new Error("network"); er.code = "network"; throw er; }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { const er = new Error(data.error || "server_error"); er.code = data.error || "server_error"; er.status = r.status; throw er; }
  return data;
}
function errMsg(e) {
  const c = e && e.code;
  if (c === "network") return "الاتصال غير مستقر، حاول بعد قليل.";
  return ERR[c] || "حدث خطأ، حاول مجدداً.";
}
const TABS = [
  { id: "my-task", label: "مهمتي", icon: "🎯" },
  { id: "pool", label: "المتاحة", icon: "🎲" },
  { id: "team", label: "الفريق", icon: "👥" },
  { id: "ideas", label: "أفكار", icon: "💡" },
];
const currentTab = () => (TABS.find(t => "#" + t.id === location.hash) || TABS[0]).id;
const byStatus = s => S.tasks.filter(t => t.status === s);
// une tâche mère qu'on coordonne (isGroup) ne compte pas comme « ma tâche en cours »
const myCurrent = () => S.myId ? S.tasks.find(t => t.status === "taken" && t.assignee === S.myId && !t.isGroup) : null;
const myGroups = () => S.myId ? S.tasks.filter(t => t.status === "taken" && t.assignee === S.myId && t.isGroup) : [];
const stepsOf = t => S.stepsBy[t.id] || [];
const childrenOf = t => S.tasks.filter(c => c.parentId === t.id);
const parentOf = t => t.parentId ? S.tasks.find(p => p.id === t.parentId) : null;
const hasParts = t => stepsOf(t).length + childrenOf(t).length > 0;
const pendingChildren = t => childrenOf(t).filter(c => c.status !== "done").length;
// avancement : automatique (étapes cochées + sous-tâches) s'il y a un découpage, sinon le curseur
function pct(t) {
  if (t.status === "done") return 100;
  const st = stepsOf(t), ch = childrenOf(t), n = st.length + ch.length;
  if (n) return Math.round((st.filter(s => s.done).length * 100 + ch.reduce((a, c) => a + pct(c), 0)) / n);
  return Math.max(0, Math.min(100, Math.round(+t.progress || 0)));
}
const canSplit = t => S.myId && ((t.status === "taken" && t.assignee === S.myId) || (S.isAdmin && (t.status === "open" || t.status === "taken")));
const P = v => "⁦" + v + "%⁩"; // isolé LTR pour l’affichage RTL

function nameOf(id) {
  if (!id) return "—";
  const u = S.users[id];
  const n = (u && u.display_name) || "عضو سابق";
  return id === S.myId ? n + " (أنا)" : n;
}
function avatar(id, lg) {
  const u = S.users[id];
  const n = ((u && u.display_name) || "؟").trim();
  return h("span", { class: "av ini" + (lg ? " lg" : ""), style: `background:hsl(${(id * 67) % 360} 65% 48%)` }, n.charAt(0) || "؟");
}

/* ---------- writes (one at a time per doc) ---------- */
const queues = {};
function serial(id, fn) {
  const run = (queues[id] || Promise.resolve()).then(fn, fn);
  queues[id] = run.catch(() => {});
  return run;
}
async function write(id, fn, okMsg) {
  try { await serial(id, fn); if (okMsg) toast(okMsg); refresh(); return true; }
  catch (e) {
    if (e && e.code === "not_logged_in") { S.authed = false; render(); }
    toast(errMsg(e)); refresh();
    return false;
  }
}

/* two-tap confirmation */
function armed(key, label, armedLabel, onGo, cls) {
  const on = S.armed === key;
  return h("button", { class: "btn sm " + (on ? "armed" : (cls || "ghost")), onclick: () => {
    if (S.armed === key) { S.armed = null; onGo(); }
    else { S.armed = key; render(); setTimeout(() => { if (S.armed === key) { S.armed = null; render(); } }, 3500); }
  } }, on ? armedLabel : label);
}

/* ---------- actions ---------- */
async function take(taskId) {
  const tk = S.tasks.find(x => x.id === taskId);
  if (myCurrent() && !(tk && tk.isGroup)) { location.hash = "#my-task"; return toast("أنهِ مهمتك الحالية أولاً 😉"); }
  const ok = await write(taskId, () => api("POST", `/api/tasks/${taskId}/take`));
  if (ok) { toast("انطلق! 🚀"); location.hash = "#my-task"; }
}
async function setProgress(t, v) {
  v = Math.max(0, Math.min(100, Math.round(v)));
  if (v === pct(t)) return;
  t.progress = v; render();
  await write(t.id, () => api("POST", `/api/tasks/${t.id}/progress`, { progress: v }));
}
async function saveNotes(t) {
  const v = S.drafts[t.id];
  if (v === undefined) return;
  if (v === (t.notes || "")) { delete S.drafts[t.id]; updateSaveState(t.id); return; }
  S.saving[t.id] = true; updateSaveState(t.id);
  const ok = await write(t.id, () => api("POST", `/api/tasks/${t.id}/notes`, { notes: v.slice(0, 8000) }));
  if (ok) t.notes = v.slice(0, 8000);
  S.saving[t.id] = false;
  if (ok && S.drafts[t.id] === v) delete S.drafts[t.id];
  updateSaveState(t.id);
}
const noteTimers = {};
function onNoteInput(t, el) {
  S.drafts[t.id] = el.value; updateSaveState(t.id);
  clearTimeout(noteTimers[t.id]);
  noteTimers[t.id] = setTimeout(() => saveNotes(t), 1500);
}
function updateSaveState(id) {
  const el = document.querySelector(`[data-save="${id}"]`);
  if (!el) return;
  if (S.saving[id]) { el.textContent = "جارٍ الحفظ…"; el.className = "savestate"; }
  else if (S.drafts[id] !== undefined) { el.textContent = "● تعديلات غير محفوظة"; el.className = "savestate dirty"; }
  else { el.textContent = "✓ محفوظ — يراه كل الفريق"; el.className = "savestate"; }
}
async function finish(t) {
  if (S.drafts[t.id] !== undefined) await saveNotes(t);
  const ok = await write(t.id, () => api("POST", `/api/tasks/${t.id}/finish`));
  if (ok) { confetti(); toast("أحسنت! يمكنك سحب المهمة التالية 🎲"); location.hash = "#pool"; }
}
async function release(t) {
  if (S.drafts[t.id] !== undefined && t.assignee === S.myId) await saveNotes(t);
  await write(t.id, () => api("POST", `/api/tasks/${t.id}/release`), "أُعيدت المهمة إلى المهام المتاحة");
}
async function approve(t) { await write(t.id, () => api("POST", `/api/tasks/${t.id}/approve`), "تم قبول الاقتراح ✓"); }
async function remove(t, msg) { await write(t.id, () => api("DELETE", `/api/tasks/${t.id}`), msg || "حُذفت"); }
async function reopen(t) { await write(t.id, () => api("POST", `/api/tasks/${t.id}/reopen`), "أُعيد فتح المهمة"); }

/* découpage */
async function addSub(t, mode) {
  const title = (S.subDraft[t.id] || "").trim();
  if (!title) { const el = document.querySelector(`[data-key="sub-${t.id}"]`); if (el) el.focus(); return toast("اكتب عنوان المهمة الفرعية"); }
  const ok = await write(t.id, () => api("POST", `/api/tasks/${t.id}/subtasks`, { title, mode }),
    mode === "share" ? "أُرسلت إلى المهام المتاحة 🎲" : "أُضيفت الخطوة ✓");
  if (ok) { S.subDraft[t.id] = ""; render(); const el = document.querySelector(`[data-key="sub-${t.id}"]`); if (el) el.focus({ preventScroll: true }); }
}
async function toggleStep(t, s) {
  s.done = !s.done; render();
  await write("s" + s.id, () => api("POST", `/api/steps/${s.id}/toggle`, { done: s.done }));
}
/* champ de texte enregistré automatiquement (texte d'une étape, consignes d'une sous-tâche) */
async function saveField(key, current, doSave) {
  const v = S.drafts[key];
  if (v === undefined) return;
  if (v === current) { delete S.drafts[key]; updateSaveState(key); return; }
  S.saving[key] = true; updateSaveState(key);
  const ok = await write(key, () => doSave(v));
  S.saving[key] = false;
  if (ok && S.drafts[key] === v) delete S.drafts[key];
  updateSaveState(key);
}
function autoText(key, current, doSave, placeholder) {
  return [h("textarea", { "data-key": "f-" + key, maxlength: "8000", placeholder,
    value: S.drafts[key] !== undefined ? S.drafts[key] : current,
    oninput: e => { S.drafts[key] = e.target.value; updateSaveState(key); clearTimeout(noteTimers[key]); noteTimers[key] = setTimeout(() => saveField(key, current, doSave), 1500); },
    onblur: () => { clearTimeout(noteTimers[key]); saveField(key, current, doSave); } }),
    h("div", { class: "savestate", "data-save": key })];
}
async function delStep(s) { await write("s" + s.id, () => api("DELETE", `/api/steps/${s.id}`), "حُذفت الخطوة"); }

function stats() {
  // les tâches mères ne comptent pas en double : leurs sous-tâches sont comptées à leur place
  const active = S.tasks.filter(t => !t.isGroup && (t.status === "open" || t.status === "taken" || t.status === "done"));
  const total = active.length, done = active.filter(t => t.status === "done").length;

}

  let last = 0, m;
  while ((m = re.exec(text))) {
    const url = m[0].replace(/[.,;:!?)\]»،]+$/, "");
    out.push(text.slice(last, m.index), h("a", { href: url, target: "_blank", rel: "noopener noreferrer", dir: "ltr" }, url));

}

  sw.onclick = () => {
    mode = mode === "login" ? "register" : "login";
    extra.style.display = mode === "register" ? "" : "none";
    submit.textContent = mode === "register" ? "إنشاء الحساب" : "دخول";
    sw.textContent = mode === "register" ? "لديك حساب؟ سجّل الدخول" : "ليس لديك حساب؟ أنشئ حساباً";
    pass.autocomplete = mode === "register" ? "new-password" : "current-password";
    msg.textContent = "";
  };
  const form = h("form", { id: "login", class: "card", style: "margin-top:40px", onsubmit: async e => {
    e.preventDefault(); msg.textContent = ""; submit.disabled = true;
    try {
      if (mode === "register") await api("POST", "/api/register", { username: user.value, password: pass.value, displayName: name.value, joinCode: code.value });
      else await api("POST", "/api/login", { username: user.value, password: pass.value });
      await refresh(true); connectEvents();
    } catch (err) { msg.textContent = errMsg(err); }
    submit.disabled = false;
  } },
    h("div", { style: "text-align:center;font-size:44px" }, "🎯"),
    h("h2", { style: "text-align:center" }, "توزيع المهام"),
    h("p", { class: "muted small", style: "text-align:center;margin:0" }, "اسحب مهمة، املأ قسمك، وتابع تقدّم الفريق."),
    h("label", { class: "lbl" }, "اسم المستخدم"), user,
    h("label", { class: "lbl" }, "كلمة المرور"), pass,
    extra, msg, submit, sw);
  return form;
}
function openAccount() {
  const cur = h("input", { type: "password", autocomplete: "current-password", dir: "ltr" });
  const nw = h("input", { type: "password", autocomplete: "new-password", dir: "ltr" });
  modal(h("div", {},
    h("div", { class: "row" }, avatar(S.myId, true), h("div", {}, h("h2", { style: "margin:0" }, S.me.displayName), h("div", { class: "muted small", dir: "ltr" }, "@" + S.me.username))),
    h("details", {}, h("summary", {}, "تغيير كلمة المرور"),
      h("label", { class: "lbl" }, "كلمة المرور الحالية"), cur, h("label", { class: "lbl" }, "كلمة المرور الجديدة"), nw,
      h("div", { class: "btns" }, h("button", { class: "btn primary", onclick: async () => {
        try { await api("POST", "/api/me/password", { current: cur.value, password: nw.value }); toast("تم تغيير كلمة المرور ✓"); closeModal(); }
        catch (e) { toast(errMsg(e)); }
      } }, "حفظ"))),
    h("div", { class: "btns" },
      h("button", { class: "btn danger", onclick: async () => { await api("POST", "/api/logout").catch(() => {}); closeModal(); location.reload(); } }, "تسجيل الخروج"),
      h("button", { class: "btn ghost", onclick: closeModal }, "إغلاق"))));
}

/* ---------- gestion de l'équipe (admin) ---------- */
function viewAdmin() {
  const out = [h("div", { class: "sec" }, h("h2", {}, `إدارة الفريق (${S.userList.length})`))];
  out.push(h("div", { class: "card", style: "background:var(--accent-soft);border-color:transparent" },
    h("h3", {}, "🔑 رمز الانضمام"),
    S.joinCode
      ? [h("p", { class: "small", style: "margin:4px 0 8px" }, "أرسل هذا الرمز ورابط التطبيق لموظفيك ليُنشئوا حساباتهم:"),
         h("div", { class: "row" }, h("code", { class: "grow", dir: "ltr", style: "font-size:18px;font-weight:700" }, S.joinCode),
           h("button", { class: "btn sm", onclick: async () => {
             try { await navigator.clipboard.writeText(`${location.origin}\nرمز الانضمام: ${S.joinCode}`); toast("تم النسخ ✓"); } catch (e) { toast("انسخ الرمز يدوياً"); }
           } }, "نسخ"))]
      : h("p", { class: "small", style: "margin:4px 0 0" }, "التسجيل مغلق: أضف المتغير JOIN_CODE في Railway لفتحه.")));
  for (const u of S.userList) {
    const isMe = u.id === S.myId;
    out.push(h("div", { class: "card" },
      h("div", { class: "row" }, avatar(u.id, true), h("div", { class: "grow" }, h("strong", {}, nameOf(u.id)), u.is_admin ? h("div", {}, h("span", { class: "chip" }, "👑 مسؤول")) : null)),
      isMe ? null : h("div", { class: "btns" },
        h("button", { class: "btn sm", onclick: () => write("u" + u.id, () => api("POST", `/api/users/${u.id}/admin`, { isAdmin: !u.is_admin }), u.is_admin ? "أُزيلت صلاحية المسؤول" : "أصبح مسؤولاً 👑") }, u.is_admin ? "إزالة صلاحية المسؤول" : "جعله مسؤولاً"),
        h("button", { class: "btn sm", onclick: () => resetPassword(u) }, "كلمة مرور جديدة"),
        armed("delu-" + u.id, "حذف الحساب", "حذف؟ اضغط مجدداً", () => write("u" + u.id, () => api("DELETE", `/api/users/${u.id}`), "حُذف الحساب"), "danger"))));
  }
  return out;
}
function resetPassword(u) {
  const pw = h("input", { type: "text", dir: "ltr", value: Math.random().toString(36).slice(2, 10) });
  modal(h("div", {}, h("h2", {}, "كلمة مرور جديدة لـ " + nameOf(u.id)),
    h("p", { class: "muted small", style: "margin:0" }, "أرسلها له، ويمكنه تغييرها من حسابه."), h("label", { class: "lbl" }, "كلمة المرور"), pw,
    h("div", { class: "btns" },
      h("button", { class: "btn primary", onclick: async () => { if (await write("u" + u.id, () => api("POST", `/api/users/${u.id}/password`, { password: pw.value }), "تم التغيير ✓")) closeModal(); } }, "حفظ"),
      h("button", { class: "btn ghost", onclick: closeModal }, "إلغاء"))));
}

/* ---------- synchronisation ---------- */
let refreshing = null, refreshAgain = false;
async function refresh(force) {
  if (refreshing) { refreshAgain = true; return refreshing; }
  refreshing = (async () => {
    try {
      const d = await api("GET", "/api/state");
      S.authed = true; S.error = null;
      S.me = d.me; S.myId = d.me.id; S.isAdmin = d.me.isAdmin; S.joinCode = d.joinCode || "";
      S.userList = d.users; S.users = Object.fromEntries(d.users.map(u => [u.id, u]));
      S.tasks = d.tasks.map(t => ({ id: t.id, title: t.title, desc: t.descr, status: t.status, proposedBy: t.proposed_by, assignee: t.assignee,
        progress: t.progress, notes: t.notes, createdAt: t.created_at, takenAt: t.taken_at, doneAt: t.done_at,
        parentId: t.parent_id, isGroup: !!t.is_group }));
      S.projectInfo = d.projectInfo || { text: "" };
      S.polls = (d.polls || []).map(p => ({ id: p.id, question: p.question, createdBy: p.created_by, closed: p.closed, createdAt: p.created_at,
        options: (d.pollOptions || []).filter(o => o.poll_id === p.id).map(o => ({ id: o.id, label: o.label, addedBy: o.added_by })),
        votes: (d.pollVotes || []).filter(v => v.poll_id === p.id).map(v => ({ userId: v.user_id, optionId: v.option_id })) }));
      S.stepsBy = {};
      for (const s of d.steps || []) (S.stepsBy[s.task_id] = S.stepsBy[s.task_id] || []).push(s);
      S.loaded = true;
    } catch (e) {
      if (e.status === 401) S.authed = false; else S.error = e.code || "error";
    }
    scheduleRender();
  })();
  await refreshing; refreshing = null;
  if (refreshAgain) { refreshAgain = false; return refresh(); }
}
let es = null, debounce;
function connectEvents() {
  if (es || !window.EventSource) return;
  es = new EventSource("/api/events");
  es.addEventListener("changed", () => { clearTimeout(debounce); debounce = setTimeout(refresh, 150); });
  es.onopen = () => { if (S.stale) { S.stale = false; refresh(); } };
  es.onerror = () => { S.stale = true; scheduleRender(); if (es.readyState === 2) { es = null; setTimeout(() => { if (S.authed) connectEvents(); }, 5000); } };
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.authed) refresh(); });
setInterval(() => { if (S.authed && S.error) refresh(); }, 15000);

/* ---------- boot ---------- */
render();
refresh(true).then(() => { if (S.authed) connectEvents(); });
})();
</script>
